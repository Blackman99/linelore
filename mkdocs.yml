site_name: linelore docs
site_description: The pull request, linked issues and review comments behind any line of code, in one terminal command. GitHub, GitLab and Gitea/Forgejo.
site_url: https://blackman99.github.io/linelore/docs/
repo_url: https://github.com/Blackman99/linelore
repo_name: Blackman99/linelore
edit_uri: edit/main/docs/
copyright: MIT © 2026 Blackman99
theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon.svg
  logo: assets/logo.svg
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  features: [navigation.instant, navigation.top, content.code.copy, search.highlight, toc.follow]
extra_css: [stylesheets/swiss.css]
nav:
  - Overview: index.md
  - Install: install.md
  - Usage: usage.md
  - Forges: forges.md
  - Configuration: config.md
  - Command reference: reference.md
  - FAQ: faq.md
  - Blog:
    - All posts: blog/index.md
    - "git blame tells you who. Here's how to get the why.": blog/git-blame-says-who-not-why.md
    - "git blame 只告诉你是谁改的，linelore 告诉你为什么": blog/git-blame-says-who-not-why-zh.md
  - Home page ↗: https://blackman99.github.io/linelore/
markdown_extensions: [admonition, attr_list, tables, {toc: {permalink: true}}, pymdownx.highlight, pymdownx.superfences]
