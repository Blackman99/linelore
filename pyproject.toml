[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linelore"
version = "0.2.0"
description = "git blame tells you who. linelore tells you why: the PR, linked issues and review comments behind any line."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []
keywords = ["git", "blame", "github", "pull-request", "code-archaeology", "cli"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Environment :: Console", "Topic :: Software Development :: Version Control :: Git"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
linelore = "linelore.cli:main"
git-lore = "linelore.cli:main"

[project.urls]
Homepage = "https://blackman99.github.io/linelore/"
Source = "https://github.com/Blackman99/linelore"
